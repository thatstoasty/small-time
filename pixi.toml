[workspace]
description = "Datetime library."
authors = ["Mikhail Tavarez <miktavarez@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/thatstoasty/small-time"
repository = "https://github.com/thatstoasty/small-time"
preview = ["pixi-build"]

[tasks]
tests = "sh -c 'find test -name \"test_*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
benchmarks = "sh -c 'find benchmarks -name \"*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
examples = "sh -c 'find examples -name \"*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"

# Linting and Formatting
lint_docs = "mojo doc --Werror --diagnose-missing-doc-strings -o /dev/null ./small_time"
mojo_format = "mojo format small_time --line-length 120"
format = [{ task = "mojo_format" }]

# Build and publish
build = { cmd = "pixi build -o ." }
publish = { cmd = "find . -name 'small_time-*.conda' | xargs pixi upload https://prefix.dev/api/v1/upload/mojo-community" }
build_and_publish = [{ task = "build" }, { task = "publish" }]

[package]
name = "small_time"
version = "26.3.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[dependencies]
mojo = ">=1.0.0b1,<1.0.0b2"

[package.host-dependencies]
mojo-compiler = ">=1.0.0b1,<1.0.0b2"

[package.build-dependencies]
mojo-compiler = ">=1.0.0b1,<1.0.0b2"

[package.run-dependencies]
mojo-compiler = ">=1.0.0b1,<1.0.0b2"
